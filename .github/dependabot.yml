#
# Dependabot: keep every dependency at its latest version.
# Oracle rule (2026-09-18): nothing stays pinned to an old release; the
# checks decide, not a person. `dependabot-auto-merge.yml` approves and
# merges each update once CI is green. This depot has no npm tree: the
# only dependencies are the GitHub Actions the workflows pin by SHA and
# the pinned `reuse` in requirements-check.txt.
# Cooldown (2026-10-15): a version is proposed only after it has been public
# for 7 days, so a hijacked or broken release is usually flagged by others
# before it reaches this repository. Security updates ignore the cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "ci(deps)"
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
