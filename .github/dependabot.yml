#
# Dependabot: keep every dependency at its latest version.
# Oracle rule (2026-09-18): nothing stays pinned to an old release; the
# checks decide, not a person. `dependabot-auto-merge.yml` approves and
# merges each update once CI is green. This depot has no npm tree: the
# only dependencies are the GitHub Actions the workflows pin by SHA and
# the pinned `reuse` in requirements-check.txt.
# Cooldown (2026-10-15): a version is proposed only after it has been public
# for 7 days, so a hijacked or broken release is usually flagged by others
# before it reaches this repository. Security updates ignore the cooldown.
# Grouping (2026-10-29): each ecosystem sends ONE pull request with all its minor and patch
# updates (group `minor-and-patch`), and every major update comes alone, so a major that
# breaks the build holds back only itself, not the safe updates. Dependabot cannot group
# across ecosystems, so github-actions / pip each still open their own. Same shape as
# numinia-web, numinia-archive and numinia-engine.
# (Before, 2026-10-20: one group `all-dependencies` with majors inside.)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "ci(deps)"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
