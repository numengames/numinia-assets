name: Resource declarations

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  licensing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-check.txt
      - name: Install checker
        run: python -m pip install -r requirements-check.txt
      - name: Check every file declaration
        run: python -m reuse lint
      - name: Exercise rejection of missing declarations
        run: python -m unittest discover -s tests -v
