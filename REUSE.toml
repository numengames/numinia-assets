version = 1

# List documentation explicitly. Never use a catch-all that silently licenses
# incoming media. A new resource requires its own reviewed declaration.
[[annotations]]
path = [
  "README.md",
  "AGENTS.md",
  "CONTRIBUTING.md",
  "CHANGELOG.md",
  "TRADEMARKS.md",
  "SECURITY.md",
  "content/README.md",
  "open-worlds/README.md",
  "open-worlds/machine/README.md",
]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC-BY-4.0"

# Repository configuration copied byte-for-byte from numinia-archive (the
# family keeps these files identical by hand — STD-015 § The family
# pipeline); the auto-merge workflow carries no header there either, so it
# is declared here, by name, never by a glob.
[[annotations]]
path = [".github/workflows/dependabot-auto-merge.yml"]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

# The public worlds fleet's orders (numinia-archive ADR-069): machine data,
# CC0 like the archive's records. JSON cannot carry a header, so the folder's
# orders are declared here. The glob reaches only `.json` orders inside
# open-worlds/, never media: tests/test_open_worlds.py refuses any other file there.
[[annotations]]
path = ["open-worlds/*.json"]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

# Test data for the fleet's signed requests: EIP-712 digests and signatures
# made by throwaway keys (only public data). JSON cannot carry a header, so
# the one file is declared here by name.
[[annotations]]
path = ["tests/fleet_vectors.json"]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

# Community-health file, CC0 like the archive's copy.
[[annotations]]
path = ["CODE_OF_CONDUCT.md"]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

